<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>SPIDERMAILS — Platform Setor Gmail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button{-webkit-appearance:none;appearance:none;background:0;border:0;color:inherit;font:inherit;font-family:inherit;cursor:pointer;padding:0;margin:0;text-align:center;-webkit-tap-highlight-color:transparent;outline:none}
:root{--bg:#0a0a0f;--bg-soft:#12121a;--card:#18181f;--card-2:#1f1f28;--line:#2a2a35;--txt:#fafafa;--muted:#9ca3af;--red:#dc2626;--red-lite:#ef4444;--red-dark:#991b1b;--blue:#3b82f6;--blue-dark:#2563eb;--blue-deep:#1d4ed8;--ok:#22c55e;--warn:#f59e0b;--wa:#25D366;--tg:#229ED9;--r:18px;--drawer-w:300px;--bnav-h:76px}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.5;font-weight:600;overflow-x:hidden;letter-spacing:-.01em}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 500px at 50% -10%,rgba(220,38,38,.15),transparent 65%),radial-gradient(700px 500px at 100% 100%,rgba(59,130,246,.1),transparent 60%)}
#app{position:relative;z-index:1;min-height:100vh}
h1,h2,h3,h4{font-weight:800;letter-spacing:-.02em;color:var(--txt)}
h2{font-size:20px}h3{font-size:15.5px}
.lbl{font-size:11px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:12.5px}
strong,b{font-weight:800}
.field{margin-bottom:14px}
label{display:block;font-size:12px;font-weight:800;color:#cbd5e1;margin-bottom:7px;letter-spacing:.3px}
input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),select,textarea{width:100%;padding:13px 15px;border-radius:14px;border:1.5px solid var(--line);background:var(--card-2);color:var(--txt);font-size:13.5px;font-family:inherit;outline:none;transition:.24s;-webkit-appearance:none;appearance:none;font-weight:600}
textarea{resize:vertical;min-height:90px;line-height:1.65}
input:focus,select:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(220,38,38,.15)}
input::placeholder,textarea::placeholder{color:#6b7280;font-weight:500}
select{background-image:linear-gradient(45deg,transparent 50%,#9ca3af 50%),linear-gradient(135deg,#9ca3af 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:38px}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;border:1.5px solid var(--line);background:var(--card-2);color:var(--txt);font-weight:800;font-size:13.5px;font-family:inherit;transition:.3s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.3);overflow:hidden}
.btn:hover{transform:translateY(-2px);border-color:#3a3a48;box-shadow:0 12px 26px -10px rgba(0,0,0,.5)}
.btn:active{transform:translateY(0) scale(.96)}
.btn.primary{background-image:linear-gradient(135deg,var(--red-lite),var(--red),var(--red-dark));border-color:transparent;color:#fff;box-shadow:0 12px 28px -14px rgba(220,38,38,.95),inset 0 1px 0 rgba(255,255,255,.2)}
.btn.blue{background-image:linear-gradient(135deg,var(--blue),var(--blue-deep));border-color:transparent;color:#fff;box-shadow:0 12px 28px -14px rgba(59,130,246,.9),inset 0 1px 0 rgba(255,255,255,.2)}
.btn.ok{background-image:linear-gradient(135deg,#16a34a,#22c55e);border-color:transparent;color:#fff;box-shadow:0 12px 28px -14px rgba(34,197,94,.8)}
.btn.bad{background-image:linear-gradient(135deg,#dc2626,#ef4444);border-color:transparent;color:#fff;box-shadow:0 12px 28px -14px rgba(239,68,68,.8)}
.btn.warn{background-image:linear-gradient(135deg,#d97706,#f59e0b);border-color:transparent;color:#fff;box-shadow:0 12px 28px -14px rgba(245,158,11,.8)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);box-shadow:none}
.btn.sm{padding:8px 14px;font-size:12.5px;border-radius:11px}
.btn.block{width:100%;margin-top:6px}
.btn svg{flex:none}
.note{border-radius:14px;padding:13px 15px;font-size:12.8px;line-height:1.65;border:1.5px solid var(--line);background:var(--card-2);color:#cbd5e1;margin-bottom:16px;font-weight:600}
.note.warn{border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.08);color:#fcd34d}
.note.bad{border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08);color:#fca5a5}
.note.ok{border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.08);color:#86efac}
.auth-page{position:relative;min-height:100vh;background:#0a0a0f;display:flex;flex-direction:column;overflow:hidden;padding:0}
.auth-hero{position:relative;width:100%;height:48vh;min-height:280px;max-height:540px;overflow:hidden;background:linear-gradient(135deg,#1a0508,#0a0a0f);flex:none}
.auth-hero video,.auth-hero iframe{width:100%;height:100%;object-fit:cover;display:block;border:0;opacity:.85}
.auth-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,15,.25) 0%,rgba(10,10,15,0) 25%,rgba(10,10,15,.5) 65%,#0a0a0f 100%);pointer-events:none;z-index:1}
.auth-hero .hero-brand{position:absolute;bottom:24px;left:0;right:0;text-align:center;z-index:2;padding:0 20px}
.auth-hero .hero-brand h1{font-size:40px;font-weight:900;letter-spacing:-.045em;line-height:1;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.8)}
.auth-hero .hero-brand h1 .accent{background:linear-gradient(135deg,#ef4444,#dc2626 50%,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(220,38,38,.9))}
.auth-hero .hero-brand p{font-size:10.5px;color:rgba(255,255,255,.75);letter-spacing:3px;text-transform:uppercase;font-weight:800;margin-top:8px;text-shadow:0 2px 10px rgba(0,0,0,.9)}
.auth-hero-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#7f1d1d;font-weight:900;font-size:13px;letter-spacing:3px;background:radial-gradient(circle at 50% 40%,rgba(220,38,38,.2),transparent 70%),linear-gradient(135deg,#1a0508,#0a0a0f);gap:8px}
.auth-hero-placeholder span{font-size:10px;font-weight:600;opacity:.5;letter-spacing:1px;color:#9ca3af}
.auth-body{position:relative;flex:1;width:100%;display:flex;flex-direction:column;align-items:center;padding:16px 20px 40px;margin-top:-10px;z-index:3}
.auth-form-wrap{width:100%;max-width:420px;display:flex;flex-direction:column;animation:authIn .7s cubic-bezier(.34,1.56,.64,1) both}
@keyframes authIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.auth-tagline{text-align:center;font-size:11.5px;color:var(--muted);font-weight:800;letter-spacing:1.5px;margin-bottom:14px;text-transform:uppercase}
.auth-tagline .dot{color:#ef4444;margin:0 8px;opacity:.7}
.auth-card{width:100%;background:linear-gradient(180deg,var(--card),var(--card-2));border:1.5px solid var(--line);border-radius:28px;padding:26px 22px;box-shadow:0 30px 80px -34px rgba(0,0,0,.8),0 0 60px -28px rgba(220,38,38,.3);position:relative;overflow:hidden}
.auth-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#dc2626,#3b82f6,#dc2626,transparent);background-size:300% 100%;animation:shineBar 4s linear infinite}
@keyframes shineBar{0%{background-position:0% 0}100%{background-position:300% 0}}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#0a0a0f;border:1.5px solid var(--line);border-radius:14px;padding:5px;margin-bottom:22px}
.atab{padding:12px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-weight:800;font-size:13.5px;font-family:inherit;cursor:pointer;transition:.3s}
.atab.on{background-image:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;box-shadow:0 10px 26px -12px rgba(220,38,38,.9)}
.afield{margin-bottom:16px}
.ainput-wrap{position:relative;display:flex;align-items:center;border-radius:14px;background:var(--card-2);border:1.5px solid var(--line);transition:.24s}
.ainput-wrap:focus-within{border-color:var(--red);box-shadow:0 0 0 4px rgba(220,38,38,.12)}
.ainput-wrap .lead{flex:none;padding:0 4px 0 15px;display:grid;place-items:center;color:#6b7280}
.ainput-wrap:focus-within .lead{color:var(--red-lite)}
.ainput-wrap input{flex:1;width:100%;padding:13px 12px;background:transparent;border:0;color:var(--txt);font-size:14px;font-family:inherit;font-weight:600;outline:none;min-width:0;box-shadow:none!important;border-radius:0!important}
.ainput-wrap .trail{flex:none;padding:0 12px 0 4px;display:grid;place-items:center}
.ainput-icon-btn{background:transparent;border:0;padding:6px;border-radius:8px;cursor:pointer;color:#6b7280;transition:.2s;display:grid;place-items:center;font-family:inherit}
.ainput-icon-btn:hover{color:var(--txt);background:rgba(220,38,38,.15)}
.abtn{position:relative;width:100%;padding:16px 22px;border-radius:16px;border:0;background-image:linear-gradient(135deg,#ef4444,#dc2626 50%,#991b1b);background-size:220% auto;color:#fff;font-family:inherit;font-size:14.5px;font-weight:800;letter-spacing:.3px;cursor:pointer;transition:.4s;display:inline-flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 16px 40px -12px rgba(220,38,38,.95);margin-top:4px;overflow:hidden}
.abtn:hover{background-position:right center;transform:translateY(-3px)}
.abtn:active{transform:translateY(0) scale(.98)}
.abtn.google{background-image:none;background:var(--card-2);color:var(--txt);border:1.5px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.3);margin-bottom:0}
.abtn.google:hover{border-color:#3a3a48;background:#252530}
.abtn.google svg{width:20px;height:20px;flex:none}
.auth-divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:#6b7280;font-size:11.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--line)}
.alink{color:var(--red-lite);font-weight:800;cursor:pointer;background:transparent;border:0;font-family:inherit;font-size:12.5px;padding:0}
.alink:hover{text-decoration:underline;color:#fca5a5}
.shell{min-height:100vh;display:flex;flex-direction:column;position:relative}
.topbar{position:sticky;top:0;z-index:80;display:flex;align-items:center;gap:12px;padding:13px 16px;background:rgba(10,10,15,.92);backdrop-filter:blur(24px);border-bottom:1.5px solid var(--line);max-width:900px;margin:0 auto;width:100%}
.hamburger{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:14px;border:1.5px solid var(--line);background:var(--card-2);cursor:pointer;transition:.3s;padding:0}
.hamburger:hover{border-color:var(--red);box-shadow:0 0 0 4px rgba(220,38,38,.12)}
.hamburger .bars{display:flex;flex-direction:column;gap:4px}
.hamburger .bars span{display:block;width:20px;height:2.5px;border-radius:3px;background:linear-gradient(90deg,#ef4444,#3b82f6);transition:.3s}
.hamburger.active .bars span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
.hamburger.active .bars span:nth-child(2){opacity:0}
.hamburger.active .bars span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}
.topbar .brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:900;letter-spacing:-.02em;margin-right:auto;min-width:0;flex:1;color:var(--txt)}
.topbar .brand .mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;overflow:hidden;background:linear-gradient(135deg,#dc2626,#1d4ed8);box-shadow:0 8px 22px -8px rgba(220,38,38,.7)}
.topbar .brand .mark svg,.topbar .brand .mark img{width:100%;height:100%;display:block}
.topbar .brand .mark img{object-fit:cover}
.topbar .brand .brandtext{display:inline-flex;align-items:center;font-weight:900;font-size:17px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .brand .hl{background:linear-gradient(90deg,#ef4444,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
.topbar-action{width:42px;height:42px;flex:none;border-radius:14px;border:1.5px solid var(--line);background:var(--card-2);display:grid;place-items:center;color:#cbd5e1;cursor:pointer;transition:.3s}
.topbar-action:hover{border-color:#fca5a5;color:#ef4444;background:rgba(239,68,68,.1)}
.main{flex:1;padding:16px 16px calc(var(--bnav-h) + 30px + env(safe-area-inset-bottom));max-width:900px;width:100%;margin:0 auto}
.main>*{animation:pageIn .55s cubic-bezier(.22,1,.36,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.main>*:nth-child(1){animation-delay:0s}
.main>*:nth-child(2){animation-delay:.05s}
.main>*:nth-child(3){animation-delay:.1s}
.main>*:nth-child(4){animation-delay:.15s}
.main>*:nth-child(5){animation-delay:.2s}
.main>*:nth-child(6){animation-delay:.25s}
.main>*:nth-child(7){animation-delay:.3s}
.card{background:linear-gradient(180deg,var(--card),var(--card-2));border:1.5px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:.3s}
.card:hover{border-color:#3a3a48}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.card-head h3{margin:0;display:flex;align-items:center;gap:10px;font-size:15px}
.card h3{display:flex;align-items:center;gap:9px;font-size:15px;margin-bottom:12px}
.dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#ef4444,#3b82f6);flex:none}
.ic-dot{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,rgba(220,38,38,.2),rgba(59,130,246,.1));border:1.5px solid rgba(220,38,38,.35);color:#fca5a5}
.pad{padding:28px}.center{text-align:center}
.profile-hero{position:relative;overflow:hidden;background:radial-gradient(600px 240px at 50% 0%,rgba(220,38,38,.25),transparent 70%),linear-gradient(180deg,#1a0508,#0a0a0f);border:1.5px solid rgba(220,38,38,.3);border-radius:22px;padding:26px 20px 22px;margin-bottom:14px;text-align:center}
.profile-avatar-wrap{position:relative;width:112px;height:112px;margin:0 auto 14px;z-index:1}
.profile-avatar{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,#dc2626,#1d4ed8);color:#fff;font-weight:900;font-size:44px;overflow:hidden;box-shadow:0 0 0 4px rgba(255,255,255,.1),0 0 26px 4px rgba(220,38,38,.5);border:3px solid #0a0a0f}
.profile-avatar img{width:100%;height:100%;display:block;object-fit:cover}
.profile-photo-btn{position:absolute;right:0;bottom:4px;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;border:3px solid #0a0a0f;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 22px -8px rgba(220,38,38,.8);transition:.3s}
.profile-name{font-size:22px;font-weight:900;color:var(--txt);letter-spacing:-.025em;position:relative;z-index:1}
.profile-email{font-size:13px;color:#cbd5e1;font-weight:600;margin-top:3px;position:relative;z-index:1;word-break:break-all}
.profile-actions{display:flex;gap:8px;justify-content:center;margin-top:14px;position:relative;z-index:1;flex-wrap:wrap}
.saldo-card{position:relative;overflow:hidden;background:radial-gradient(600px 220px at 100% 0%,rgba(220,38,38,.15),transparent 60%),radial-gradient(500px 200px at 0% 100%,rgba(59,130,246,.12),transparent 65%),linear-gradient(180deg,var(--card),var(--card-2));border:1.5px solid rgba(220,38,38,.25);border-radius:22px;padding:21px;margin-bottom:14px}
.saldo-card .head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.saldo-card .label{display:flex;align-items:center;gap:9px;color:#cbd5e1;font-size:13.5px;font-weight:800}
.saldo-card .label svg{color:#ef4444;flex:none}
.saldo-card .arrow-btn{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#ef4444,#dc2626);display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 10px 22px -10px rgba(220,38,38,.8);cursor:pointer}
.saldo-card .amount{font-size:33px;font-weight:900;letter-spacing:-.03em;color:var(--txt);line-height:1.1;margin-bottom:14px}
.saldo-card .chips{display:flex;gap:8px;flex-wrap:wrap}
.schip{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:12px;font-size:12px;font-weight:800;border:1.5px solid transparent}
.schip.red{background:rgba(220,38,38,.15);border-color:rgba(220,38,38,.35);color:#fca5a5}
.schip.blue{background:rgba(59,130,246,.15);border-color:rgba(59,130,246,.35);color:#93c5fd}
.schip.green{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.35);color:#86efac}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat-box{background:linear-gradient(180deg,var(--card),var(--card-2));border:1.5px solid var(--line);border-radius:18px;padding:15px;display:flex;align-items:center;gap:12px;min-height:80px;transition:.3s}
.stat-box:hover{border-color:rgba(220,38,38,.4);transform:translateY(-3px)}
.stat-box .icon{width:44px;height:44px;flex:none;border-radius:13px;display:grid;place-items:center;background:rgba(220,38,38,.15);border:1.5px solid rgba(220,38,38,.3);color:#ef4444}
.stat-box .body{min-width:0;flex:1}
.stat-box .lbl{font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:2px}
.stat-box .val{font-size:15.5px;font-weight:900;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chan-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chan-btn{padding:20px 12px;border-radius:18px;background:var(--card-2);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer;transition:.3s;font-family:inherit}
.chan-btn:hover{border-color:#3a3a48;transform:translateY(-4px)}
.chan-btn .ic{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:#fff}
.chan-btn .ic svg{width:32px;height:32px}
.chan-btn.wa .ic{background:linear-gradient(160deg,#25D366,#128C7E);box-shadow:0 10px 24px -10px rgba(37,211,102,.7)}
.chan-btn.tg .ic{background:linear-gradient(160deg,#37BBFE,#229ED9);box-shadow:0 10px 24px -10px rgba(34,158,217,.7)}
.chan-btn .txt{font-size:13.5px;font-weight:800;color:var(--txt)}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:90;background:rgba(10,10,15,.96);backdrop-filter:blur(24px);border-top:1.5px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:grid;gap:2px;max-width:900px;margin:0 auto;box-shadow:0 -10px 40px -22px rgba(0,0,0,.7)}
.bnav.cols-5{grid-template-columns:repeat(5,1fr)}
.bnav.cols-6{grid-template-columns:repeat(6,1fr)}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 6px;border-radius:13px;color:var(--muted);font-size:10.5px;font-weight:700;cursor:pointer;transition:.3s;font-family:inherit;background:transparent;border:0;position:relative}
.bnav-item .bnav-icon{width:38px;height:36px;border-radius:12px;display:grid;place-items:center}
.bnav-item.active{color:#ef4444}
.bnav-item.active .bnav-icon{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 10px 22px -10px rgba(220,38,38,.8);transform:scale(1.05) translateY(-2px)}
.bnav-item .bnav-badge{position:absolute;top:2px;right:22px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:#ef4444;color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center;border:2px solid #0a0a0f}
.drawer-overlay{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:.3s}
.drawer-overlay.open{opacity:1;pointer-events:auto}

async function loadAll(){try{_syncStatus='saving';updateSyncDot();const admin=await isAdminAuthed();const myEmail=state.userEmail||get(K.sess,null);let uQ=sb.from('users').select('*');let dQ=sb.from('deposits').select('*').order('created_at',{ascending:false});let wQ=sb.from('withdrawals').select('*').order('created_at',{ascending:false});let sQ=sb.from('stock').select('*').order('created_at',{ascending:false}).limit(admin?2000:1000);let cQ=Promise.resolve(null);if(admin){cQ=Promise.all([sb.from('stock').select('*',{count:'exact',head:true}).or('status.eq.available,status.is.null'),sb.from('stock').select('*',{count:'exact',head:true}).eq('status','taken'),sb.from('stock').select('*',{count:'exact',head:true}).eq('status','used')]).then(([av,tk,us])=>({available:av.count||0,taken:tk.count||0,used:us.count||0,total:(av.count||0)+(tk.count||0)+(us.count||0)})).catch(e=>null)}if(!admin){if(myEmail){uQ=uQ.eq('email',myEmail);dQ=dQ.eq('user_email',myEmail);wQ=wQ.eq('user_email',myEmail);sQ=sQ.eq('taken_by',myEmail)}else{uQ=uQ.eq('email','__none__');dQ=dQ.eq('user_email','__none__');wQ=wQ.eq('user_email','__none__');sQ=sQ.eq('id','__none__')}}const[u,d,w,s,st,counts]=await Promise.all([uQ,dQ,wQ,sQ,sb.from('settings').select('*').eq('id',1).maybeSingle(),cQ]);if(u.error)throw u.error;if(d.error)throw d.error;if(w.error)throw w.error;if(s.error)throw s.error;_cache.users=(u.data||[]).map(userFromDB);_cache.deps=(d.data||[]).map(depFromDB);_cache.wds=(w.data||[]).map(wdFromDB);_cache.stock=(s.data||[]).map(stockFromDB);if(counts)_cache.stockCounts=counts;else _cache.stockCounts=null;_cache.set=st.data&&st.data.data?st.data.data:JSON.parse(JSON.stringify(DEF_SET));_syncStatus='idle';updateSyncDot();return true}catch(e){console.error('[LOAD]',e);_syncStatus='offline';updateSyncDot();return false}}
async function loadMoreStock(count=1000){const currentLen=stock().length;const{data,error}=await sb.from('stock').select('*').order('created_at',{ascending:false}).range(currentLen,currentLen+count-1);if(error)throw error;const newItems=(data||[]).map(stockFromDB);const existingIds=new Set(stock().map(x=>x.id));const filtered=newItems.filter(x=>!existingIds.has(x.id));if(filtered.length)_cache.stock=_cache.stock.concat(filtered);return filtered.length}

function startRealtime(){
  if(_realtimeChannel){try{sb.removeChannel(_realtimeChannel)}catch(e){}_realtimeChannel=null}
  if(_visHandler){document.removeEventListener('visibilitychange',_visHandler);_visHandler=null}
  _realtimeChannel=sb.channel('spidermails-rt')
    .on('postgres_changes',{event:'*',schema:'public',table:'users'},handleRealtime)
    .on('postgres_changes',{event:'*',schema:'public',table:'deposits'},handleRealtime)
    .on('postgres_changes',{event:'*',schema:'public',table:'withdrawals'},handleRealtime)
    .on('postgres_changes',{event:'*',schema:'public',table:'stock'},handleRealtime)
    .on('postgres_changes',{event:'*',schema:'public',table:'settings'},handleRealtime)
    .subscribe(status=>{
      if(status==='SUBSCRIBED'){_syncStatus='idle';updateSyncDot()}
      else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){_syncStatus='offline';updateSyncDot()}
    });
  _visHandler=async()=>{
    if(!document.hidden&&_realtimeChannel){
      await loadAll();
      if(state.view!=='auth')render();
    }
  };
  document.addEventListener('visibilitychange',_visHandler);
}
function handleRealtime(payload){if(state.view==='auth')return;const{table,eventType,new:n,old:o}=payload;try{if(table==='users'){if(eventType==='INSERT'||eventType==='UPDATE'){const u=userFromDB(n);const i=_cache.users.findIndex(x=>x.id===u.id);if(i>=0)_cache.users[i]=u;else _cache.users.push(u)}else if(eventType==='DELETE')_cache.users=_cache.users.filter(x=>x.id!==o.id)}else if(table==='deposits'){if(eventType==='INSERT'||eventType==='UPDATE'){const d=depFromDB(n);const i=_cache.deps.findIndex(x=>x.id===d.id);if(i>=0)_cache.deps[i]=d;else{_cache.deps.unshift(d);if(state.view==='admin'&&eventType==='INSERT'&&d.status==='pending'){toast('🔔 Setoran baru: '+d.gmail,'ok')}}}else if(eventType==='DELETE')_cache.deps=_cache.deps.filter(x=>x.id!==o.id)}else if(table==='withdrawals'){if(eventType==='INSERT'||eventType==='UPDATE'){const w=wdFromDB(n);const i=_cache.wds.findIndex(x=>x.id===w.id);if(i>=0)_cache.wds[i]=w;else _cache.wds.unshift(w)}else if(eventType==='DELETE')_cache.wds=_cache.wds.filter(x=>x.id!==o.id)}else if(table==='stock'){if(eventType==='INSERT'||eventType==='UPDATE'){const s=stockFromDB(n);const i=_cache.stock.findIndex(x=>x.id===s.id);if(i>=0)_cache.stock[i]=s;else _cache.stock.unshift(s)}else if(eventType==='DELETE')_cache.stock=_cache.stock.filter(x=>x.id!==o.id)}else if(table==='settings'){if(n&&n.data)_cache.set=n.data}if(state.view==='user'){const cu=me();if(!cu||cu.blocked){doLogout();return}}render()}catch(e){console.warn('[RT]',e)}}
function updateSyncDot(){const el=document.getElementById('syncDot');if(!el)return;el.style.background=_syncStatus==='idle'?'#22c55e':_syncStatus==='saving'?'#f59e0b':'#94a3b8'}
function getUserDepositMode(email){const u=users().find(x=>x.email===email);if(u&&(u.depositMode==='free'||u.depositMode==='generate'))return u.depositMode;return settings().depositMode||'generate'}
const me=()=>users().find(u=>u.email===state.userEmail)||null;
function userBalance(email){const earned=deps().filter(d=>d.userEmail===email&&d.status==='approved').reduce((a,d)=>a+(Number(d.paid)||0),0);const out=wds().filter(w=>w.userEmail===email&&w.status!=='rejected').reduce((a,w)=>a+(Number(w.amount)||0),0);return earned-out}
function stockStats(){if(_cache.stockCounts&&state.view==='admin')return _cache.stockCounts;const s=stock();const g=x=>x.status||'available';return{total:s.length,available:s.filter(x=>g(x)==='available').length,taken:s.filter(x=>g(x)==='taken').length,used:s.filter(x=>g(x)==='used').length}}

let toastTimer;
function toast(msg,type){const t=$('toast');const ic=type==='bad'?'xmark':type==='warn'?'info':'check';t.innerHTML=icon(ic,16)+'<span>'+esc(msg)+'</span>';t.className='toast show '+(type||'ok');clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.className='toast'},2800)}
function showConfirm({title='Konfirmasi',message='',gmail='',okText='Ya, Lanjut',cancelText='Batal',type='danger'}={}){return new Promise(resolve=>{const root=$('cfmRoot');const iconName=type==='danger'?'trash':'info';root.innerHTML=`<div class="cfm-overlay" id="cfmOverlay"><div class="cfm-modal"><div class="cfm-icon ${type==='info'?'info':''}">${icon(iconName,36)}</div><h3>${esc(title)}</h3>${message?`<p>${esc(message)}</p>`:''}${gmail?`<div class="cfm-gmail">${esc(gmail)}</div>`:''}<div class="cfm-actions"><button type="button" class="cfm-btn cancel" id="cfmCancel">${esc(cancelText)}</button><button type="button" class="cfm-btn ${type==='danger'?'danger':'primary'}" id="cfmOk">${esc(okText)}</button></div></div></div>`;const overlay=$('cfmOverlay');requestAnimationFrame(()=>overlay.classList.add('show'));const close=v=>{overlay.classList.remove('show');setTimeout(()=>{root.innerHTML='';resolve(v)},280)};$('cfmCancel').onclick=()=>close(false);$('cfmOk').onclick=()=>close(true);overlay.onclick=e=>{if(e.target===overlay)close(false)};document.addEventListener('keydown',function esc1(ev){if(ev.key==='Escape'){close(false);document.removeEventListener('keydown',esc1)}})})}
function copyText(txt){if(!txt){toast('Tidak ada data','warn');return}const done=()=>toast('Berhasil disalin','ok');if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done))}else fallbackCopy(txt,done)}
function fallbackCopy(txt,cb){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.top='-1000px';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');cb()}catch(e){toast('Gagal menyalin','bad')}document.body.removeChild(ta)}
function compressImage(file,maxDim,q){return new Promise((res,rej)=>{const rd=new FileReader();rd.onload=e=>{const img=new Image();img.onload=()=>{try{let w=img.naturalWidth,h=img.naturalHeight;if(w>maxDim||h>maxDim){const r=Math.min(maxDim/w,maxDim/h);w=Math.round(w*r);h=Math.round(h*r)}const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',q))}catch(err){rej(err)}};img.onerror=()=>rej(new Error('img'));img.src=e.target.result};rd.onerror=()=>rej(new Error('read'));rd.readAsDataURL(file)})}
function computeLeaderboard(period){const ds=deps().filter(d=>d.status==='approved');const now=Date.now();let cutoff=0;if(period==='today'){const t=new Date();t.setHours(0,0,0,0);cutoff=t.getTime()}else if(period==='7d'){cutoff=now-7*86400000}else if(period==='30d'){cutoff=now-30*86400000}const filtered=ds.filter(d=>{const t=new Date(d.reviewedAt||d.createdAt).getTime();return!isNaN(t)&&t>=cutoff});const map={};filtered.forEach(d=>{const k=d.userEmail;if(!map[k])map[k]={email:k,gmail:0,saldo:0};map[k].gmail++;map[k].saldo+=Number(d.paid)||0});const us=users();return Object.values(map).map(x=>{const u=us.find(y=>y.email===x.email)||{};return{email:x.email,nickname:u.nickname||x.email.split('@')[0],photo:u.photo||'',gmail:x.gmail,saldo:x.saldo}}).sort((a,b)=>b.gmail-a.gmail||b.saldo-a.saldo).slice(0,100)}

function renderShell({accentClass,brandLabel,navItems,currentPage,navAction,userName,userSub,userPhoto,content,badges}){const open=state.drawerOpen;const bnItems=navItems.filter(i=>i.inBnav);const drawerNavHtml=navItems.map(item=>{const active=item.key===currentPage;const c=item.badgeKey?(badges[item.badgeKey]||0):0;const bc=c>0?`<span class="badgecount">${c}</span>`:'';return `<button class="dnav ${active?'on':''}" data-act="${navAction}" data-page="${item.key}"><span class="ic">${icon(item.icon,17)}</span><span class="lbl">${esc(item.label)}</span>${bc}</button>`}).join('');const bnavHtml=bnItems.map(item=>{const active=item.key===currentPage;const c=item.badgeKey?(badges[item.badgeKey]||0):0;const bc=c>0?`<span class="bnav-badge">${c>9?'9+':c}</span>`:'';return `<button class="bnav-item ${active?'active':''}" data-act="${navAction}" data-page="${item.key}"><span class="bnav-icon">${icon(item.icon,19)}</span><span>${esc(item.label)}</span>${bc}</button>`}).join('');const avatarHtml=userPhoto?`<img src="${esc(userPhoto)}" alt="">`:esc(initials(userName));const syncDotHtml='<span class="sync-dot" id="syncDot" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;margin-left:6px;vertical-align:middle;box-shadow:0 0 8px #22c55e"></span>';return `<div class="shell ${accentClass}"><header class="topbar"><button class="hamburger ${open?'active':''}" data-act="toggle-drawer"><span class="bars"><span></span><span></span><span></span></span></button><div class="brand"><span class="mark">${renderLogoMark()}</span><span class="brandtext">${brandLabel}</span>${syncDotHtml}</div><button class="topbar-action" data-act="logout">${icon('logout',17)}</button></header><main class="main">${content}</main><nav class="bnav ${bnItems.length===6?'cols-6':'cols-5'}">${bnavHtml}</nav><div class="drawer-overlay ${open?'open':''}" data-act="close-drawer"></div><aside class="drawer ${open?'open':''}"><div class="drawer-head"><div class="brand"><span class="mark older="Jumlah" min="1" max="9999" style="flex:1;min-width:140px"><button class="btn primary" data-act="do-generate">${icon('zap',15)} Generate</button></div></div>`;const listCard=`<div class="card"><div class="card-head"><h3>${isFree?'':`<span class="step-badge" style="display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;font-size:11.5px;font-weight:900;margin-right:4px">2</span> `}Gmail Anda (${readyPool.length})</h3>${readyPool.length?`<div class="flexrow"><button class="btn sm blue" data-act="copy-all-my-pool">${icon('copy',13)} Salin</button><button class="btn sm primary" data-act="fill-my-pool">${icon('zap',13)} Isi</button><button class="btn sm bad" data-act="delete-all-my-pool">${icon('trash',13)} Hapus Semua</button></div>`:''}</div>${readyPool.length?`<div>${readyPool.map(it=>`<div class="gen-row" style="display:flex;align-items:center;gap:8px;padding:11px 12px;background:var(--card-2);border:1.5px solid var(--line);border-radius:12px;margin-bottom:6px"><span style="flex:1;font-family:ui-monospace,monospace;font-size:12.5px;color:var(--txt);word-break:break-all;font-weight:700">${esc(it.gmail)}</span><button type="button" class="gen-copy-btn" style="width:38px;height:38px;border-radius:11px;border:1.5px solid rgba(59,130,246,.4);background:rgba(59,130,246,.15);color:#93c5fd;display:grid;place-items:center;cursor:pointer;padding:0" data-act="copy-stock" data-id="${esc(it.id)}">${icon('copy',14)}</button><button type="button" class="gen-copy-btn" style="width:38px;height:38px;border-radius:11px;border:1.5px solid rgba(239,68,68,.4);background:rgba(239,68,68,.15);color:#fca5a5;display:grid;place-items:center;cursor:pointer;padding:0" data-act="delete-my-gmail" data-id="${esc(it.id)}">${icon('trash',14)}</button></div>`).join('')}</div>`:`<div class="empty" style="padding:24px"><div class="bigicon">${icon('archive',36)}</div><p>${isFree?'Belum ada ge const roomCards=activeRooms.map(r=>{const pws=(r.passwords||[]).filter(p=>p.active!==false);const rates=pws.map(p=>Number(p.rate)||0).filter(x=>x>0);const maxRate=rates.length?Math.max(...rates):0;const sel=state.selectedRoom===r.id;return `<div class="room-card ${sel?'selected':''}" data-act="pick-room" data-id="${esc(r.id)}"><div class="rh"><div class="rt">${icon('layers',18)}<span>${esc(r.label)}</span></div>${maxRate>0?`<span class="schip red" style="font-size:11px;padding:5px 10px">${icon('zap',11)} max ${rupiah(maxRate)}</span>`:''}</div><div class="rmeta">${pws.length} password tersedia</div></div>`}).join('');
const roomPicker=`<div class="card"><h3>${isFree?'':`<span class="step-badge" style="display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;font-size:11.5px;font-weight:900;margin-right:4px">3</span> `}Pilih Room</h3><div>${roomCards}</div></div>`;
let pwPickerHtml='';if(state.selectedRoom){const activeRoom=activeRooms.find(r=>r.id===state.selectedRoom);const activePws=(activeRoom.passwords||[]).filter(p=>p.active!==false);const pwOptions=activePws.length?activePws.map(p=>{const sel=state.selectedPwId===p.id;const r=Number(p.rate)||0;return `<button type="button" class="pw-opt ${sel?'selected':''}" data-act="pick-pw" data-id="${esc(p.id)}"><span class="pw-radio"></span><span class="pw-body"><span class="pw-name">${esc(p.label)}</span><span class="pw-value">${esc(p.value)}</span><span class="pw-rate">💵 ${rupiah(r)} /gmail</span></span><span class="pw-check">${icon('check',16)}</span></button>`}).join(''):`<div class="empty" style="padding:24px 10px"><p>Tidak ada password aktif di room ini.</p></div>`;pwPickerHtml=`<div class="card"><h3>${isFree?'':`<span class="step-badge" style="display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;font-size:11.5px;font-weight:900;margin-right:4px">4</span> `}Pilih Password — ${esc(activeRoom.label)}</h3><div class="pw-options">${pwOptions}</div></div>`}
const canSubmit=state.selectedRoom&&state.selectedPwId;let formCard='';if(canSubmit){const selPw=findPassword(state.selectedPwId);const selRate=selPw?Number(selPw.password.rate)||0:0;formCard=`<div class="card"><h3>${isFree?'':`<span class="step-badge" style="display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#dc2626,#3b82f6);color:#fff;font-size:11.5px;font-weight:900;margin-right:4px">5</span> `}Kirim Setoran</h3><form data-act="deposit"><div class="field"><label>Daftar Gmail (1 per baris)</label><textarea id="depGmail" rows="6" placeholder="satu gmail per baris" required>${esc(state.depGmailDraft||'')}</textarea><div class="counter-bar"><span class="counter-pill" id="depCountPill">${icon('list',13)} <span id="depCount">0</span> terdeteksi</span><span class="counter-pill ok" style="background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.4);color:#86efac">${icon('wallet',13)} Rate: ${rupiah(selRate)}/gmail</span></div></div><div class="note ${isFree?'ok':'warn'}">${isFree?icon('info',14)+' Gmail apa saja boleh.':icon('info',14)+' <b>PENTING:</b> Gmail luar generate otomatis ditolak.'}</div><button class="btn primary block" type="submit">${icon('send',16)} Kirim Setoran</button></form></div>`}
return `${modeBanner}${rateBanner}${generateCard}${listCard}${roomPicker}${pwPickerHtml}${formCard}${rulesCard}`}
function pageLaporan(u){const all=deps().filter(d=>d.userEmail===u.email).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));const f=state.reportFilter;const list=f==='all'?all:all.filter(d=>d.status===f);const count=st=>all.filter(d=>d.status===st).length;const chips=`<div class="chipbar"><button class="chip ${f==='all'?'on':''}" data-act="rfilter" data-f="all">Semua <span class="cnt">${all.length}</span></button><button class="chip ${f==='approved'?'on':''}" data-act="rfilter" data-f="approved">Disetujui <span class="cnt">${count('approved')}</span></button><button class="chip ${f==='rejected'?'on':''}" data-act="rfilter" data-f="rejected">Ditolak <span class="cnt">${count('rejected')}</span></button><button class="chip ${f==='pending'?'on':''}" data-act="rfilter" data-f="pending">Pending <span class="cnt">${count('pending')}</span></button></div>`;const items=list.length?list.map(d=>{const badge=d.status==='approved'?`<span class="badge ok">${icon('check',11)} Ok</span>`:d.status==='rejected'?`<span class="badge bad">${icon('xmark',11)} Ditolak</span>`:`<span class="badge warn">${icon('hourglass',11)} Pending</span>`;const delBtn=d.status==='approved'?'':`<button class="del-btn sm" style="width:32px;height:32px;border-radius:9px;border:1.5px solid rgba(239,68,68,.4);background:rgba(239,68,68,.15);color:#fca5a5;display:grid;place-items:center;cursor:pointer;padding:0" data-act="del-dep" data-id="${esc(d.id)}">${icon('trash',13)}</button>`;const rb=d.status==='rejected'&&d.reason?`<div style="font-size:11.5px;color:#fca5a5;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:7px 10px;margin-top:6px"><b>Alasan:</b> ${esc(d.reason)}</div>`:'';const paidTag=(d.status==='approved'&&Number(d.paid)>0)?`<span style="font-size:10.5px;color:#86efac;font-weight:800;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.35);padding:2px 7px;border-radius:6px">+${rupiah(d.paid)}</span>`:'';const roomTag=d.roomLabel?`<span style="font-size:10px;color:#93c5fd;font-weight:800;background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);padding:2px 7px;border-radius:6px">${esc(d.roomLabel)}</span>`:'';return `<div style="padding:10px 12px;background:var(--card-2);border:1px solid var(--line);border-radius:10px;margin-bottom:8px"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="flex:1;font-family:ui-monospace,monospace;font-size:12.5px;word-break:break-all;font-weight:700">${esc(d.gmail)}</span>${roomTag}${paidTag}${badge}${delBtn}</div>${rb}</div>`}).join(''):`<div class="empty"><div class="bigicon">${icon('inbox',44)}</div><p>Belum ada data.</p></div>`;const copyBtn=list.length?`<button class="btn blue sm" data-act="copy-laporan">${icon('copy',14)} Copy (${list.length})</button>`:'';return `<div class="card"><div class="card-head"><h3><span class="ic-dot">${icon('doc',14)}</span>Laporan Gmail</h3>${copyBtn}</div>${chips}<div>${items}</div></div>`}
function pageRiwayat(u){const all=deps().filter(d=>d.userEmail===u.email);const map={};all.forEach(d=>{const k=dayKey(d.createdAt);if(!map[k])map[k]={k,total:0,ok:0,bad:0,pend:0};map[k].total++;if(d.status==='approved')map[k].ok++;else if(d.status==='rejected')map[k].bad++;else map[k].pend++});const rows=Object.values(map).sort((a,b)=>b.k.localeCompare(a.k));const body=rows.length?rows.map(r=>`<tr><td><b>${r.k}</b></td><td>${r.total}</td><td style="color:#86efac;font-weight:800">${r.ok}</td><td style="color:#fca5a5;font-weight:800">${r.bad}</td><td style="color:#fcd34d;font-weight:800">${r.pend}</td></tr>`).join(''):'';return `<div class="card"><h3><span class="ic-dot">${icon('clock',14)}</span>Riwayat</h3>${rows.length?`<div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Total</th><th>Ok</th><th>Bad</th><th>Pend</th></tr></thead><tbody>${body}</tbody></table></div>`:`<div class="empty"><div class="bigicon">${icon('clock',44)}</div><p>Kosong</p></div>`}</div>`}
function pageWithdraw(u){const saldo=userBalance(u.email);const s=settings();const bank=(u&&u.bank)||DEFAULT_BANK;const list=wds().filter(w=>w.userEmail===u.email).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));const items=list.length?list.map(w=>{const badge=w.status==='done'?`<span class="badge ok">${icon('check',11)} Selesai</span>`:w.status==='process'?`<span class="badge info">${icon('hourglass',11)} Diproses</span>`:w.status==='rejected'?`<span class="badge bad">${icon('xmark',11)} Ditolak</span>`:`<span class="badge warn">${icon('clock',11)} Menunggu</span>`;return `<div class="listitem"><div style="flex:1;min-width:200px"><div class="gmail">${rupiah(w.amount)}</div><div class="meta"><span>${icon('wallet',12)} ${esc(w.bank)}</span><span>${icon('clock',12)} ${tgl(w.createdAt)}</span></div>${w.note?`<div style="font-size:12px;color:#fca5a5;margin-top:6px">Catatan: ${esc(w.note)}</div>`:''}</div><div>${badge}</div></div>`}).join(''):`<div class="empty"><div class="bigicon">${icon('wallet',44)}</div><p>Belum ada penarikan.</p></div>`;return `<div class="saldo-card"><div class="label">${icon('wallet',18)}<span>Saldo Tersedia</span></div><div class="amount">${rupiah(saldo)}</div><p class="muted small">Min tarik: <b>${rupiah(s.minWithdraw)}</b></p></div><div class="card"><h3><span class="ic-dot">${icon('wallet',14)}</span>Form Penarikan</h3><form data-act="withdraw"><div class="field"><label>Metode</label><select id="wdBank" required><option value="">— Pilih —</option>${PAYMENT_METHODS.map(m=>`<option value="${m}" ${bank.bankName===m?'selected':''}>${m}</option>`).join('')}</select></div><div class="field"><label>Nomor HP / Rekening</label><input type="text" id="wdAcc" value="${esc(bank.account)}" required></div><div class="field"><label>Nama Pemilik</label><input type="text" id="wdHolder" value="${esc(bank.holder)}" required></div><div class="field"><label>Nominal (Rp)</label><div style="display:flex;gap:8px"><input type="number" id="wdAmount" placeholder n></div></div><div>${pwList}</div><div class="flexrow mt"><input type="text" id="newPwLabel_${esc(r.id)}" placeholder="Label (cth: Password C)" style="flex:1;min-width:140px"><input type="text" id="newPwValue_${esc(r.id)}" placeholder="Isi password" style="flex:1;min-width:140px"><input type="number" id="newPwRate_${esc(r.id)}" placeholder="Rate Rp" value="${Number(s.pricePerGmail)||4000}" style="width:110px"><button class="btn primary sm" data-act="add-pw" data-room="${esc(r.id)}">${icon('plus',13)} Pwd</button></div></div>`}).join('');return `<div class="card" style="background:linear-gradient(120deg,rgba(220,38,38,.1),rgba(59,130,246,.05));border-color:rgba(220,38,38,.3)"><h3><span class="ic-dot">${icon('video',14)}</span>Video Banner Login</h3><div class="field"><label>URL Video (.mp4 atau YouTube)</label><input id="setBannerUrl" type="url" placeholder="https://contoh.com/banner.mp4 atau link YouTube" value="${esc(s.bannerVideoUrl||'')}"></div><div class="note small">${icon('info',14)} Format didukung: .mp4, .webm, atau link YouTube (youtube.com/watch?v=… atau youtu.be/…)</div><button class="btn primary block" data-act="save-banner">${icon('check',16)} Simpan Video</button></div><div class="card" style="background:linear-gradient(120deg,rgba(59,130,246,.1),rgba(220,38,38,.05));border-color:rgba(59,130,246,.3)"><h3><span class="ic-dot">${icon('layers',14)}</span>Room & Password</h3><p class="muted small mb">Buat room setoran, isi password. Setiap password punya rate sendiri.</p><div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap"><input type="text" id="newRoomLabel" placeholder="Nama room baru (cth: Room Good)" style="flex:1;min-width:200px"><button class="btn primary" data-act="add-room">${icon('plus',16)} Tambah Room</button></div>${roomRows||`<div class="empty"><p>Belum ada room.</p></div>`}</div><div class="card" style="background:linear-gradient(120deg,rgba(59,130,246,.08),rgba(220,38,38,.04));border-color:rgba(59,130,246,.25)"><h3><span class="ic-dot">${icon('sparkle',14)}</span>Test Server</h3><div class="flexrow"><button class="btn primary" data-act="test-server">${icon('zap',15)} Test</button><button class="btn blue" data-act="force-refresh">${icon('link',15)} Refresh</button></div><div id="testResult" style="margin-top:10px;font-size:12.5px;line-height:1.7"></div></div><div class="card"><h3><span class="ic-dot">${icon('image',14)}</span>Logo Aplikasi</h3><div class="flexrow" style="gap:16px;align-items:center"><div style="width:90px;height:90px;border-radius:20px;overflow:hidden;flex:none;box-shadow:0 0 0 3px rgba(220,38,38,.3);background:var(--card-2);display:grid;place-items:center">${s.appLogo?`<img src="${esc(s.appLogo)}" style="width:100%;height:100%;object-fit:cover" alt="Logo">`:`<div style="width:100%;height:100%">${DEFAULT_LOGO_SVG}</div>`}</div><div style="flex:1;min-width:200px"><input type="file" id="appLogoInput" accept="image/*" style="display:none"><div class="flexrow"><button class="btn primary sm" data-act="app-logo-upload">${icon('image',14)} ${s.appLogo?'Ganti':'Upload'}</button>${s.appLogo?`<button class="btn bad sm" data-act="clear-app-logo">${icon('xmark',14)} Hapus</button>`:''}</div></div></div></div><div class="card"><h3><span class="ic-dot">${icon('lock',14)}</span>Halaman Setor</h3><div class="listitem mb"><span class="muted small">Status</span><b class="badge ${s.depositOpen?'ok':'bad'}">${s.depositOpen?'TERBUKA':'DITUTUP'}</b></div><button class="btn ${s.depositOpen?'bad':'ok'} block" data-act="toggle-deposit">${s.depositOpen?icon('lock',16)+' Tutup':icon('unlock',16)+' Buka'}</button><div class="divider"></div><div class="field"><label>Pesan Saat Ditutup</label><textarea id="setCloseMsg">${esc(s.closeMessage)}</textarea></div><div class="field"><label>Reward Default (Rp)</label><input type="number" id="setPrice" value="${Number(s.pricePerGmail)||0}" min="0"></div><div class="field"><label>Min Penarikan (Rp)</label><input type="number" id="setMinWd" value="${Number(s.minWithdraw)||0}" min="0"></div><div class="field"><label>Batas Setoran/Hari (0=Unlimited)</label><input type="number" id="setMaxDep" value="${Number(s.maxDepositPerDay)||0}" min="0"></div><button class="btn primary block" data-act="save-general">${icon('check',16)} Simpan</button></div><div class="card"><h3><span class="ic-dot">${icon('shield',14)}</span>Rules</h3><textarea id="setRules" style="min-height:200px">${esc(s.rules)}</textarea><button class="btn primary block mt" data-act="save-rules">${icon('check',16)} Simpan Rules</button></div><div class="card"><h3><span class="ic-dot">${waIcon(14)}</span>Channel WhatsApp</h3><div class="field"><label>Nomor WA Admin</label><input id="setAdminWa" type="tel" placeholder="628xxxxxxxxxx" value="${esc(s.adminWa||'')}"></div><div class="field"><label>Link Channel</label><input id="setWaLink" type="url" placeholder="https://whatsapp.com/channel/xxxxx" value="${esc(s.waLink)}"></div><div class="field"><label>Popup Otomatis</label><div class="listitem" style="margin-bottom:0"><b style="font-size:13px">${s.waPopupEnabled?'Aktif':'Nonaktif'}</b><button class="btn sm ${s.waPopupEnabled?'bad':'ok'}" data-act="toggle-wa-popup">${s.waPopupEnabled?'Matikan':'Aktifkan'}</button></div></div><button class="btn primary block mt" data-act="save-wa">${icon('check',16)} Simpan</button></div><div class="card"><h3><span class="ic-dot">${tgIcon(14)}</span>Channel Telegram</h3><div class="field"><label>Username / Link</label><input id="setTgLink" type="text" placeholder="@user atau https://t.me/xxx" value="${esc(s.telegramLink)}"></div><button class="btn primary block mt" data-act="save-tg">${icon('check',16)} Simpan</button></div>`}
function parseGmailLines(text){const lines=String(text||'').split(/[\n,;]+/).map(s=>s.trim().toLowerCase()).filter(Boolean);const valid=[],invalid=[];const seen=new Set();for(const l of lines){if(!isGmail(l)){invalid.push(l);continue}if(seen.has(l))continue;seen.add(l);valid.push(l)}return{valid,invalid}}
function parseRekapLines(text){return String(text||'').split(/[\n,;\s]+/).map(s=>s.trim().toLowerCase()).filter(s=>s&&isGmail(s))}
function updateDepositCounter(text){const pill=$('depCountPill');const cntEl=$('depCount');if(!pill||!cntEl)return;const{valid,invalid}=parseGmailLines(text);cntEl.textContent=valid.length;pill.classList.remove('ok','bad');if(valid.length>0)pill.classList.add('ok');else if(text.trim().length>0)pill.classList.add('bad')}
function openTelegram(){const s=settings();const raw=String(s.telegramLink||'').trim();if(!raw){toast('Link Telegram belum diatur','warn');return}const link=normalizeTgLink(raw);if(!link){toast('Link Telegram invalid','bad');return}window.open(link,'_blank','noopener,noreferrer')}

  }
  await loadAll();
  let su=null,isAdminSession=false;
  try{
    const{data:{session:s2}}=await sb.auth.getSession();
    su=s2;
    if(su&&su.user){
      const{data:admRow}=await sb.from('admins').select('id').eq('id',su.user.id).maybeSingle();
      if(admRow)isAdminSession=true;
    }
  }catch(e){}
  if(isAdminSession){
    state.view='admin';state.adminPage='dashboard';state.userEmail=null;
  }else if(su&&su.user&&su.user.email){
    const email=String(su.user.email).toLowerCase();
    let u=_cache.users.find(x=>String(x.email||'').toLowerCase()===email);
    if(!u){
      const nick=email.split('@')[0].slice(0,20)||'user';
      const nu={
        id:su.user.id,
        nickname:nick,
        email:email,
        password:'__auth__',
        phone:'',
        photo:(su.user.user_metadata&&su.user.user_metadata.avatar_url)||'',
        bank:{...DEFAULT_BANK},
        createdAt:new Date().toISOString(),
        depositMode:'inherit',
        provider:'google'
      };
      try{await sbSaveUser(nu);_cache.users.push(nu);u=nu}catch(e){console.warn('[OAUTH REG]',e)}
    }
    if(u&&u.blocked===true){
      await sb.auth.signOut().catch(()=>{});
      put(K.sess,null);state.userEmail=null;state.view='auth';state.authTab='login';
      setTimeout(()=>alert('AKUN DIBLOKIR\n\nAlasan: '+(u.blockReason||'Melanggar')),80);
    }else if(u){
      put(K.sess,u.email);state.userEmail=u.email;
      state.view='user';state.userPage='dashboard';
    }else{
      state.view='auth';
    }
  }else if(sess){
    const u=_cache.users.find(x=>x.email===sess);
    if(u&&!u.blocked){state.view='user';state.userPage='dashboard'}
    else{put(K.sess,null);state.userEmail=null;state.view='auth'}
  }else{
    state.view='auth';
  }
  startRealtime();
  render();
})();
</script>
</body>
</html>
